<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00a8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e8555;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Stylized 'A' -->
    <path d="M 50 150 L 100 50 L 150 150" stroke="url(#grad1)" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="75" y1="110" x2="125" y2="110" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Stylized 'I' integrated into the 'A' -->
    <line x1="100" y1="50" x2="100" y2="110" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
